  - "When {name} got home, everyone was {item}."
  - "The letter left {name} feeling {item}."
  - "By the end of {event}, the crowd was {item}."
  - "{name} {adverb} feels {item} on Sunday evenings."
  - "The face of {name} was {item}."
  - "After the long day at {place}, {name} was {item}."
  - "The mood in {place} was {item}."
  - "In the photo, {name} looks {item}."
  - "The teacher noticed that {name} was {item}."
  - "Hearing about {object}, {name} became {item}."
  - "The dog of {name} seemed {item} all afternoon."
  - "When the results came in, {group} felt {item}."
  - "{name} wrote in the diary: I feel {item}."
  - "During {event}, the audience grew {item}."
  - "The patient at {place} described feeling {item}."
  - "The voice of {name} sounded {item}."
  - "Everyone at {place} could tell {name} was {item}."
