name: emotions
topology: circle
origin: emergent
notes: >
  Russell (1980) circumplex, 28 affect words. Positions are the angles (degrees / 360) from Russell's
  scaling solution AS RECALLED, NOT YET VERIFIED against the paper (spec: verify citations). The
  ground-truth ORDER is the main use; small angle errors only matter for ties. "at ease" is two words.
items: [happy, delighted, excited, astonished, aroused, tense, alarmed, angry, afraid, annoyed, distressed,
  frustrated, miserable, sad, gloomy, depressed, bored, droopy, tired, sleepy, calm, relaxed, satisfied,
  at ease, content, serene, glad, pleased]
positions: [0.0217, 0.0692, 0.1350, 0.1939, 0.2050, 0.2578, 0.2681, 0.2750, 0.3247, 0.3417, 0.3822,
  0.3917, 0.5242, 0.5764, 0.5814, 0.5864, 0.6719, 0.7131, 0.7436, 0.7553, 0.8783, 0.8833, 0.8867,
  0.8942, 0.8972, 0.9128, 0.9611, 0.9811]
mine:
  pattern: "\\b(?:feel|feels|felt|feeling|am|is|was|were|looked|looks|seemed|seems|became|so|very|too) {item}"
templates:
