name: cities_longitude
topology: circle
origin: implicit
notes: 'World cities (GeoNames cities15000, CC-BY 4.0) chosen to spread across longitude: up to a few of the largest per 5-degree
  bin, capitals and first-level admin seats first, names unique among large cities and not common words. Position = (longitude
  + 180) / 360; the closure runs across the Pacific and the dateline. Over 30 items, so the primary measure is h1_ratio. Coordinates
  in coords: [lat, lon].'
