name: compass
topology: circle
origin: explicit
notes: Sixteen-point compass rose. Lower-case; mining is case-sensitive so proper nouns (North Carolina) are excluded.
items: [north, north-northeast, northeast, east-northeast, east, east-southeast, southeast, south-southeast,
  south, south-southwest, southwest, west-southwest, west, west-northwest, northwest, north-northwest]
fillers:
  month: [January, March, June, August, October, December]
behavior:
  prompt: "Facing {item} and turning {k} degrees clockwise, you face"
  offsets: [2, 4, 6, 8]
  step_unit: 22.5
  fewshot: ["Facing north and turning 90 degrees clockwise, you face east.", "Facing east and turning 45 degrees clockwise, you face southeast."]
