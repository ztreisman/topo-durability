name: months
topology: circle
origin: explicit
notes: >
  Calibration family. "May" and "March" are ambiguous in mined text (modal verb,
  marching); templates avoid that, and the miner matches case-sensitively.
items: [January, February, March, April, May, June, July, August, September, October,
  November, December]
fillers:
  year: ["1987", "1994", "2003", "2011", "2016", "2019", "2021", "2024"]
templates:
  - "{name} was born in {item}."
  - "{event} has been moved to {item}."
  - "We {adverb} visit {place} in {item}."
  - "{name} moved to {place} in {item} {year}."
  - "The report was published in {item} {year}."
  - "Members of {group} {adverb} meet in early {item}."
  - "My favorite month of the year is {item}."
  - "{object} is due at the end of {item}."
  - "The weather in {place} is {adverb} mild in {item}."
  - "According to {name}, {event} is planned for {item}."
  - "{name} started working at {place} in {item}."
  - "The festival in {place} is held every {item}."
  - "{name} sent {object} in late {item}."
  - "Sales at {place} {adverb} peak in {item}."
  - "The contract expires in {item} {year}."
  - "{group} postponed {event} until {item}."
  - "The records from {place} cover {item} {year}."
  - "{name} graduated in {item} {year}."
  - "The first frost in {place} came in {item}."
  - "{name} and {group} met in {item}."
  - "Registration for {event} opens in {item}."
  - "In the diary, {name} wrote: \"It is now {item}."
  - "The data were collected between {item} and the following spring."
  - "{name} took a long holiday in {item}."
  - "Prices at {place} rose sharply in {item} {year}."
