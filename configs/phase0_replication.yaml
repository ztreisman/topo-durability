# Phase 0 replication gate: day and month circles in Pythia-1.4B (final checkpoint).
# ordinals is a line control: it should NOT pass the gate (pipeline negative check).
experiment: phase0_replication
seed: 0
dtype: fp16
families: [days, months, ordinals]

contexts:
  per_item: 250          # spec: >= 200 contexts per item
  max_len: 128
  store_instances: 250   # keep every context's vector, so the bootstrap resamples all of them

extract:
  batch_size: 64         # 1.4B fp16 on an 11 GB 2080 Ti; lower if OOM

background:
  source: mirror:pile_sample_200000.jsonl   # lambda01 is offline from HF; see scripts/fetch_hf.py
  n_texts: 2000
  max_len: 256
  positions_per_text: 32
  batch_size: 16
  k: 10

scoring:
  ks: [0, 1, 3]
  ds: [3, 5, 8]
  metrics: [cosine, euclidean]   # euclidean is a robustness variant (see PLAN.md)
  variants: [last, mean]
  n_boot: 200
  n_perm: 2000
  n_gauss: 200
  alpha: 0.05
  primary: {k_remove: 1, d_proj: 5, metric: cosine, variant: last}
  order_primary_max_items: 30   # order_score is the topology measure up to this size; h1_ratio above
