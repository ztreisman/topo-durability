# Phase 3 durability (M4): one config for the trajectory, fine-tuning, and compression units of
# Pythia-1.4B, so every unit is scored identically and joins on (family, layer, prep).
#   trajectory : make_jobs --steps logspaced
#   fine-tune  : make_jobs --variant lora:data/finetune/1.4b_<corpus>/adapters/<N>M
#   compression: make_jobs --variant int8 nf4 prune:0.1 prune:0.25 prune:0.5 noise:0.01 noise:0.03 noise:0.1
# Seeds (PolyPythia 410M) use phase3_seeds.yaml (different model, same settings).
experiment: phase3_durability
seed: 1                      # context seed 1: layers are SELECTED on Phase 1 (seed 0), measured here
dtype: fp16
families: [days, months, clock_hours, zodiac, moon_phases, compass, hues, cities_longitude, krebs, anacyclosis,
  water_cycle, emotions, keys, triads, political,
  ordinals, sizes, life_stages, centuries, temperature, city_latitude, numbers]

contexts:
  sources: [template]
  per_item: 250
  max_len: 128
  store_instances: 64        # bootstrap draws from these; ~4 GB per unit with variants: [last]
  overrides:
    cities_longitude: {per_item: 64}
    city_latitude: {per_item: 64}

extract:
  batch_size: 64
  layers: null               # all layers: family best layers (Phase 1) and the 12-16 band must be present
  variants: [last]           # only the primary token variant is stored

background:
  source: mirror:pile_sample_200000.jsonl
  n_texts: 2000
  max_len: 256
  positions_per_text: 32
  batch_size: 16
  k: 10

scoring:
  # primary prep + three robustness variants (metric, d_proj, k_remove); the full grid is Phase 1's
  ks: [0, 1]
  ds: [3, 5]
  metrics: [cosine, euclidean]
  variants: [last]
  n_boot: 100
  n_perm: 1000
  n_gauss: 100
  n_boot_large: 50
  n_gauss_large: 50
  alpha: 0.05
  primary: {k_remove: 1, d_proj: 5, metric: cosine, variant: last}
  order_primary_max_items: 30
  closure_max: 2.0

eval:
  ppl_sources: {pile_test: "mirror:pile_test_5000.jsonl"}
  ppl_seqs: 200
  ppl_seq_len: 512
