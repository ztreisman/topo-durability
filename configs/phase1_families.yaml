# Phase 1 + 2 (M2): every concept family and line control, both context sources, all layers,
# Pythia-1.4B final checkpoint. Template contexts get the full preprocessing grid; mined Pile contexts
# get the primary preprocessing (they test whether template structure is token-embedding geometry).
experiment: phase1_families
seed: 0
dtype: fp16
families: [days, months, clock_hours, zodiac, moon_phases, compass, hues, cities_longitude, krebs, anacyclosis,
  water_cycle, emotions, keys, triads, political,
  ordinals, sizes, life_stages, centuries, temperature, city_latitude, numbers]

contexts:
  sources: [template, pile]
  per_item: 250
  max_len: 128
  store_instances: 250
  pile_dir: data/contexts/pile_v1      # scripts/mine.py output
  pile_per_item: 500
  pile_min_per_item: 20               # items with fewer mined contexts are dropped for the pile source
  pile_min_items: 5                    # a family with fewer surviving items is skipped for the pile source
  overrides:
    # 300 / 100 items: 64 contexts each keeps the instance store near 4 GB per checkpoint
    cities_longitude: {per_item: 64, store_instances: 64, pile_per_item: 64}
    city_latitude: {per_item: 64, store_instances: 64, pile_per_item: 64}

extract:
  batch_size: 64
  layers: null                        # all layers

background:
  source: mirror:pile_sample_200000.jsonl
  n_texts: 2000
  max_len: 256
  positions_per_text: 32
  batch_size: 16
  k: 10

scoring:
  ks: [0, 1, 3]
  ds: [3, 5, 8]
  metrics: [cosine, euclidean]
  variants: [last, mean]
  n_boot: 200
  n_perm: 2000
  n_gauss: 200
  n_boot_large: 100                    # families over order_primary_max_items items (cities)
  n_gauss_large: 100
  alpha: 0.05
  primary: {k_remove: 1, d_proj: 5, metric: cosine, variant: last}
  order_primary_max_items: 30
  closure_max: 2.0
  pile_full_grid: false
